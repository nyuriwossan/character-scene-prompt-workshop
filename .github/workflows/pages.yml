name: Publish workshop to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
concurrency:
  group: workshop-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 scripts/package-source.py
      - name: Update the GitHub Pages publishing branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/gh-pages
          publish_dir="$RUNNER_TEMP/workshop-pages"
          git worktree add --detach "$publish_dir" FETCH_HEAD
          rsync -a --delete --exclude='/.git' dist/ "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" add --all
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish workshop from $GITHUB_SHA"
            git -C "$publish_dir" push origin HEAD:refs/heads/gh-pages
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
